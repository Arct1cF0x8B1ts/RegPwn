name: Build RegPwnBOF (BOF + EXE)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install MinGW-w64 cross compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64 make

    - name: Verify compiler
      run: x86_64-w64-mingw32-gcc --version

    - name: Build BOF (regpwn.x64.o)
      run: make

    - name: Build standalone EXE (regpwn.x64.exe)
      run: make test

    - name: Upload artifacts (BOF + EXE)
      uses: actions/upload-artifact@v4
      with:
        name: RegPwnBOF-binaries
        path: |
          regpwn.x64.o
          regpwn.x64.exe
        if-no-files-found: error
        retention-days: 7

    - name: Show build results
      run: |
        ls -lh regpwn.x64.*
        file regpwn.x64.o
        file regpwn.x64.exe
